<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="ALGORITHMA. Recognize the pattern. Understand the logic. Master the problem." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" opacity=".07"/></pattern>
  <radialGradient id="g1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7c6cf0" stop-opacity=".42"/><stop offset="1" stop-color="#7c6cf0" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4cae7a" stop-opacity=".22"/><stop offset="1" stop-color="#4cae7a" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-320" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#9b8fff" stop-opacity="0"/><stop offset=".5" stop-color="#9b8fff" stop-opacity="1"/><stop offset="1" stop-color="#9b8fff" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1700 0" dur="5.5s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c6cf0" stop-opacity="0"/><stop offset=".5" stop-color="#7c6cf0"/><stop offset="1" stop-color="#4cae7a" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect width="1280" height="380" rx="22"/></clipPath>
</defs>
<style>
  .ln{stroke:#7c6cf0;stroke-width:1;opacity:.18;animation:lnp 5s ease-in-out infinite}
  .nd{fill:#9b8fff;animation:ndp 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .glow1{animation:drift1 14s ease-in-out infinite}
  .glow2{animation:drift2 18s ease-in-out infinite}
  .ph{opacity:0;animation:ph 9s ease-in-out infinite}
  .ph:first-of-type{opacity:1}
  .scan{animation:scan 4.5s ease-in-out infinite}
  @keyframes lnp{0%,100%{opacity:.08}50%{opacity:.34}}
  @keyframes ndp{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,30px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-30px)}}
  @keyframes ph{0%{opacity:0;transform:translateY(10px)}6%,28%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-6px)}}
  @keyframes scan{0%{transform:translateX(-420px);opacity:0}20%,80%{opacity:1}100%{transform:translateX(420px);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.ph:first-of-type{opacity:1}}
</style>
<g clip-path="url(#card)">
  <rect width="1280" height="380" fill="#0b0d14"/>
  <rect width="1280" height="380" fill="url(#grid)"/>
  <ellipse class="glow1" cx="300" cy="120" rx="460" ry="260" fill="url(#g1)"/>
  <ellipse class="glow2" cx="1020" cy="300" rx="420" ry="240" fill="url(#g2)"/>
  <line x1="90" y1="70" x2="180" y2="150" class="ln" style="animation-delay:0.0s"/><line x1="180" y1="150" x2="70" y2="230" class="ln" style="animation-delay:0.4s"/><line x1="70" y1="230" x2="200" y2="300" class="ln" style="animation-delay:0.8s"/><line x1="180" y1="150" x2="310" y2="90" class="ln" style="animation-delay:1.2000000000000002s"/><line x1="180" y1="150" x2="330" y2="250" class="ln" style="animation-delay:1.6s"/><line x1="200" y1="300" x2="330" y2="250" class="ln" style="animation-delay:2.0s"/><line x1="310" y1="90" x2="330" y2="250" class="ln" style="animation-delay:2.4000000000000004s"/><line x1="1190" y1="80" x2="1100" y2="160" class="ln" style="animation-delay:2.8000000000000003s"/><line x1="1100" y1="160" x2="1210" y2="240" class="ln" style="animation-delay:3.2s"/><line x1="1210" y1="240" x2="1080" y2="310" class="ln" style="animation-delay:3.6s"/><line x1="1100" y1="160" x2="970" y2="70" class="ln" style="animation-delay:4.0s"/><line x1="1100" y1="160" x2="950" y2="260" class="ln" style="animation-delay:4.4s"/><line x1="1080" y1="310" x2="950" y2="260" class="ln" style="animation-delay:4.800000000000001s"/><line x1="970" y1="70" x2="950" y2="260" class="ln" style="animation-delay:5.2s"/><circle cx="90" cy="70" r="4" class="nd" style="animation-delay:0.0s"/><circle cx="180" cy="150" r="4" class="nd" style="animation-delay:0.55s"/><circle cx="70" cy="230" r="4" class="nd" style="animation-delay:1.1s"/><circle cx="200" cy="300" r="4" class="nd" style="animation-delay:1.6500000000000001s"/><circle cx="310" cy="90" r="4" class="nd" style="animation-delay:2.2s"/><circle cx="330" cy="250" r="4" class="nd" style="animation-delay:2.75s"/><circle cx="1190" cy="80" r="4" class="nd" style="animation-delay:3.3000000000000003s"/><circle cx="1100" cy="160" r="4" class="nd" style="animation-delay:3.8500000000000005s"/><circle cx="1210" cy="240" r="4" class="nd" style="animation-delay:4.4s"/><circle cx="1080" cy="310" r="4" class="nd" style="animation-delay:4.95s"/><circle cx="970" cy="70" r="4" class="nd" style="animation-delay:5.5s"/><circle cx="950" cy="260" r="4" class="nd" style="animation-delay:6.050000000000001s"/>
</g>
<rect x=".5" y=".5" width="1279" height="379" rx="22" fill="none" stroke="#262a40"/>
<text x="640" y="84" text-anchor="middle" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="7" fill="#7c6cf0">DSA COMMAND CENTER</text>
<text x="640" y="190" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="14" fill="#eceaff">ALGORITHMA</text>
<text x="640" y="190" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="14" fill="url(#sweep)">ALGORITHMA</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="27" font-weight="500" fill="#b4b1d3" text-anchor="middle">
  <text class="ph" x="640" y="248" style="animation-delay:0s">Recognize the pattern.</text>
  <text class="ph" x="640" y="248" style="animation-delay:3s">Understand the logic.</text>
  <text class="ph" x="640" y="248" style="animation-delay:6s">Master the problem.</text>
</g>
<text x="640" y="304" text-anchor="middle" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="3" fill="#6b6f8a">70 DAYS  ·  PATTERN-FIRST  ·  C++  ·  LOCAL-FIRST</text>
<rect x="380" y="336" width="520" height="2" rx="1" fill="#1d2033"/>
<rect class="scan" x="550" y="336" width="180" height="2" rx="1" fill="url(#bar)"/>
</svg>
