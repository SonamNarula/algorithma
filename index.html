<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230066FF' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALGORITHMA — Next-Gen DSA Preparation Cockpit</title>
    <meta name="description" content="Personalized DSA Preparation Platform & Command Center for Sonam Narula. 70-day structured curriculum, pattern mastery, intelligent revision, and deep analytics." />
    <!-- High-Tech Developer Typography: Outfit (Display), Plus Jakarta Sans (Interface), JetBrains Mono (Code/Metrics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <!-- Instant Zero-Flash Theme Script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('alg_theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else if (stored === 'dark') {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          } else {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDark) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.add('light');
            }
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-canvas text-content-primary antialiased selection:bg-primary/25 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
