<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-label="Learning loop: attempt a problem, record Solo, Hint or Soln, feed hints and solutions into the revision queue, then revisit" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .flow{animation:dash 1.4s linear infinite}
  .rev{animation-direction:normal}
  @keyframes dash{to{stroke-dashoffset:-32}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1100" height="400" rx="20" fill="#0b0d14"/>
<rect x=".5" y=".5" width="1099" height="399" rx="20" fill="none" stroke="#262a40"/>
<text x="40" y="34" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="5" fill="#7c6cf0">THE LEARNING LOOP</text>
<path d="M220 195 C 280 195, 280 78, 340 78" fill="none" stroke="#4cae7a" stroke-opacity=".28" stroke-width="2"/><path class="flow" d="M220 195 C 280 195, 280 78, 340 78" fill="none" stroke="#4cae7a" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 12" style="animation-delay:0.0s"/><path d="M220 195 C 280 195, 280 195, 340 195" fill="none" stroke="#e0b34a" stroke-opacity=".28" stroke-width="2"/><path class="flow" d="M220 195 C 280 195, 280 195, 340 195" fill="none" stroke="#e0b34a" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 12" style="animation-delay:0.2s"/><path d="M220 195 C 280 195, 280 312, 340 312" fill="none" stroke="#e06c6c" stroke-opacity=".28" stroke-width="2"/><path class="flow" d="M220 195 C 280 195, 280 312, 340 312" fill="none" stroke="#e06c6c" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 12" style="animation-delay:0.4s"/><path d="M540 78 C 680 78, 700 80, 830 80" fill="none" stroke="#4cae7a" stroke-opacity=".28" stroke-width="2"/><path class="flow" d="M540 78 C 680 78, 700 80, 830 80" fill="none" stroke="#4cae7a" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 12" style="animation-delay:0.6000000000000001s"/><path d="M540 195 C 680 195, 700 262, 830 262" fill="none" stroke="#e0b34a" stroke-opacity=".28" stroke-width="2"/><path class="flow" d="M540 195 C 680 195, 700 262, 830 262" fill="none" stroke="#e0b34a" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 12" style="animation-delay:0.8s"/><path d="M540 312 C 680 312, 700 290, 830 290" fill="none" stroke="#e06c6c" stroke-opacity=".28" stroke-width="2"/><path class="flow" d="M540 312 C 680 312, 700 290, 830 290" fill="none" stroke="#e06c6c" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 12" style="animation-delay:1.0s"/><path d="M945 330 V372 H130 V235" fill="none" stroke="#7c6cf0" stroke-opacity=".3" stroke-width="2"/><path class="flow rev" d="M945 330 V372 H130 V235" fill="none" stroke="#9b8fff" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 12"/><rect x="478" y="360" width="150" height="24" rx="12" fill="#0b0d14"/><text x="553" y="376" text-anchor="middle" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2" fill="#9b8fff">REVISIT LATER</text>
<rect x="40" y="155" width="180" height="80" rx="14" fill="#12141f" stroke="#7c6cf0" stroke-opacity=".55"/><text x="130.0" y="193.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#eceaff">Attempt</text><text x="130.0" y="215.0" text-anchor="middle" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#7d819c">READ · THINK · CODE</text>
<rect x="340" y="50" width="200" height="56" rx="14" fill="#12141f" stroke="#4cae7a" stroke-opacity=".55"/><text x="440.0" y="76.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#eceaff">Solo</text><text x="440.0" y="98.0" text-anchor="middle" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#7d819c">ALONE</text>
<rect x="340" y="167" width="200" height="56" rx="14" fill="#12141f" stroke="#e0b34a" stroke-opacity=".55"/><text x="440.0" y="193.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#eceaff">Hint</text><text x="440.0" y="215.0" text-anchor="middle" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#7d819c">NEEDED A NUDGE</text>
<rect x="340" y="284" width="200" height="56" rx="14" fill="#12141f" stroke="#e06c6c" stroke-opacity=".55"/><text x="440.0" y="310.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#eceaff">Soln</text><text x="440.0" y="332.0" text-anchor="middle" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#7d819c">READ THE SOLUTION</text>
<rect x="830" y="48" width="230" height="64" rx="14" fill="#12141f" stroke="#4cae7a" stroke-opacity=".55"/><text x="945.0" y="78.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#eceaff">Counts toward mastery</text><text x="945.0" y="100.0" text-anchor="middle" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#7d819c">INDEPENDENT SOLVES</text>
<rect x="830" y="230" width="230" height="100" rx="14" fill="#12141f" stroke="#9b8fff" stroke-opacity=".55"/><text x="945.0" y="278.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#eceaff">Revision queue</text><text x="945.0" y="300.0" text-anchor="middle" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#7d819c">HINT + SOLN COME BACK</text>
<circle r="5" fill="#9b8fff"><animateMotion dur="6s" repeatCount="indefinite" path="M220 195 C 280 195, 280 195, 340 195 L 540 195 C 680 195, 700 262, 830 262 L 945 262 L 945 330 V372 H130 V235"/></circle>
</svg>